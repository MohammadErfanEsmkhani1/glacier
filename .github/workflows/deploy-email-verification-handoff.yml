name: Deploy Glacier email verification

on:
  push:
    branches:
      - feature/glacier-pages-admin-foundation
    paths:
      - "supabase/functions/email-verification-handoff/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-email-verification-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy email verification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF repository secret" && exit 1)
          supabase functions deploy email-verification-handoff --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Configure private email delivery secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          test -n "$RESEND_API_KEY" || (echo "Missing RESEND_API_KEY repository secret" && exit 1)
          test -n "$RESEND_FROM_EMAIL" || (echo "Missing RESEND_FROM_EMAIL repository secret" && exit 1)
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "RESEND_API_KEY=$RESEND_API_KEY" "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL"
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY"
          fi
