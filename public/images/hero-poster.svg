<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263e50"/>
      <stop offset=".52" stop-color="#172a3d"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <radialGradient id="mint">
      <stop offset="0" stop-color="#78d8ce" stop-opacity=".32"/>
      <stop offset="1" stop-color="#78d8ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender">
      <stop offset="0" stop-color="#a28dff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#a28dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="1410" cy="220" rx="490" ry="190" fill="url(#mint)"/>
    <ellipse cx="380" cy="300" rx="520" ry="210" fill="url(#lavender)"/>
    <ellipse cx="980" cy="680" rx="760" ry="170" fill="#d5e7ec" opacity=".07"/>
  </g>
  <rect width="1920" height="1080" fill="#071321" opacity=".12"/>
</svg>
